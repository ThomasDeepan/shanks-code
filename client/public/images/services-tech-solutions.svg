<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1215" />
      <stop offset="100%" stop-color="#2A0F16" />
    </linearGradient>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#6B1E2F" stroke-width="0.8" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />
  <rect width="800" height="450" fill="url(#grid2)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="100" r="220" fill="#6B1E2F" opacity="0.28" filter="blur(60px)" />
  <circle cx="650" cy="350" r="200" fill="#C9A227" opacity="0.12" filter="blur(50px)" />

  <!-- Technical Node & Architecture Graphic -->
  <g transform="translate(60, 60)">
    <!-- Main Architecture Hub Visual -->
    <rect x="0" y="40" width="420" height="250" rx="12" fill="#15080C" stroke="#3D1822" stroke-width="1.5" />
    <rect x="0" y="40" width="420" height="36" rx="12" fill="#240D13" stroke="#3D1822" stroke-width="1" />
    <circle cx="22" cy="58" r="4.5" fill="#6B1E2F" />
    <circle cx="38" cy="58" r="4.5" fill="#C9A227" />
    <circle cx="54" cy="58" r="4.5" fill="#3E8E5A" />
    <text x="80" y="62" font-family="monospace" font-size="11" fill="#E3DFD7" opacity="0.7">SHANKS_CODE // DOMAIN_02 :: ENGINEERING_SOLUTIONS</text>

    <!-- Architecture Boxes -->
    <rect x="30" y="100" width="160" height="60" rx="8" fill="#2A0F16" stroke="#6B1E2F" stroke-width="1" />
    <text x="45" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#C9A227">REST / GRAPHQL</text>
    <text x="45" y="145" font-family="sans-serif" font-size="11" fill="#E3DFD7">Distributed APIs</text>

    <rect x="230" y="100" width="160" height="60" rx="8" fill="#2A0F16" stroke="#6B1E2F" stroke-width="1" />
    <text x="245" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#C9A227">IOT TELEMETRY</text>
    <text x="245" y="145" font-family="sans-serif" font-size="11" fill="#E3DFD7">Hardware Sensors</text>

    <rect x="130" y="190" width="160" height="60" rx="8" fill="#6B1E2F" opacity="0.9" stroke="#C9A227" stroke-width="1" />
    <text x="145" y="215" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">ENTERPRISE CLOUD</text>
    <text x="145" y="235" font-family="sans-serif" font-size="11" fill="#E5C158">Production Delivery</text>

    <!-- Connecting lines -->
    <path d="M 110 160 L 110 175 L 210 175 L 210 190" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 310 160 L 310 175 L 210 175" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Right Side Metrics Panel -->
    <g transform="translate(450, 40)">
      <rect width="230" height="115" rx="12" fill="#2A0F16" stroke="#6B1E2F" stroke-width="1" />
      <text x="20" y="32" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="2" fill="#C9A227">DOMAIN 02</text>
      <text x="20" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Custom Software</text>
      <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#E3DFD7" opacity="0.8">Cloud &amp; IoT Solutions</text>
      <text x="20" y="102" font-family="monospace" font-size="10" fill="#3E8E5A">&#8226; Full Lifecycle Engineering</text>
    </g>

    <g transform="translate(450, 175)">
      <rect width="230" height="115" rx="12" fill="#1E0B10" stroke="#3D1822" stroke-width="1" />
      <text x="20" y="32" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.5" fill="#3E8E5A">DEPLOYMENT READY</text>
      <text x="20" y="58" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Industrial Automation</text>
      <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#E3DFD7" opacity="0.8">ESP32 &#8226; Edge Gateways</text>
      <text x="20" y="102" font-family="monospace" font-size="10" fill="#C9A227">&#8226; Industry 4.0 Standard</text>
    </g>
  </g>
</svg>
