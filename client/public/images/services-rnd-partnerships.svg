<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0B11" />
      <stop offset="100%" stop-color="#2D111A" />
    </linearGradient>
    <pattern id="grid3" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C9A227" stroke-width="0.8" stroke-opacity="0.14" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)" />
  <rect width="800" height="450" fill="url(#grid3)" />

  <!-- Ambient Glow -->
  <circle cx="500" cy="120" r="240" fill="#6B1E2F" opacity="0.25" filter="blur(60px)" />
  <circle cx="200" cy="360" r="180" fill="#C9A227" opacity="0.12" filter="blur(50px)" />

  <!-- Technical R&D Graphic -->
  <g transform="translate(60, 60)">
    <!-- Main R&D Lab Console -->
    <rect x="0" y="40" width="440" height="250" rx="12" fill="#18070D" stroke="#6B1E2F" stroke-width="1.5" />
    <rect x="0" y="40" width="440" height="36" rx="12" fill="#260C14" stroke="#6B1E2F" stroke-width="1" />
    <circle cx="22" cy="58" r="4.5" fill="#6B1E2F" />
    <circle cx="38" cy="58" r="4.5" fill="#C9A227" />
    <circle cx="54" cy="58" r="4.5" fill="#3E8E5A" />
    <text x="80" y="62" font-family="monospace" font-size="11" fill="#E3DFD7" opacity="0.7">SHANKS_CODE // DOMAIN_03 :: APPLIED_RND_LABS</text>

    <!-- Oscilloscope / Telemetry Waveform -->
    <path d="M 30 140 L 70 140 L 90 95 L 115 175 L 140 110 L 165 155 L 185 140 L 250 140 L 275 105 L 295 165 L 320 120 L 340 140 L 410 140" fill="none" stroke="#C9A227" stroke-width="2.5" />
    <circle cx="115" cy="175" r="4" fill="#6B1E2F" stroke="#C9A227" stroke-width="1.5" />
    <circle cx="295" cy="165" r="4" fill="#3E8E5A" stroke="#C9A227" stroke-width="1.5" />

    <!-- Metric Badges inside Console -->
    <g transform="translate(30, 200)">
      <rect width="180" height="65" rx="8" fill="#2A0F16" stroke="#3D1822" stroke-width="1" />
      <text x="15" y="25" font-family="monospace" font-size="10" font-weight="bold" fill="#C9A227">PATENT &amp; IP FILINGS</text>
      <text x="15" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Institutional IP Support</text>
    </g>

    <g transform="translate(230, 200)">
      <rect width="180" height="65" rx="8" fill="#2A0F16" stroke="#3D1822" stroke-width="1" />
      <text x="15" y="25" font-family="monospace" font-size="10" font-weight="bold" fill="#3E8E5A">RESEARCH PUBLICATIONS</text>
      <text x="15" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Scopus &amp; IEEE Focus</text>
    </g>

    <!-- Right Side Overview -->
    <g transform="translate(470, 40)">
      <rect width="210" height="115" rx="12" fill="#6B1E2F" opacity="0.9" stroke="#C9A227" stroke-width="1" />
      <text x="20" y="32" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="2" fill="#C9A227">DOMAIN 03</text>
      <text x="20" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">R&amp;D Partnerships</text>
      <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#FBF8EE">College Labs &amp; Industry</text>
      <text x="20" y="102" font-family="monospace" font-size="10" fill="#E5C158">&#8226; Collaborative R&amp;D</text>
    </g>

    <g transform="translate(470, 175)">
      <rect width="210" height="115" rx="12" fill="#2A0F16" stroke="#6B1E2F" stroke-width="1" />
      <text x="20" y="32" font-family="monospace" font-size="10" font-weight="bold" fill="#C9A227">LAB PROTOCOL</text>
      <text x="20" y="58" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Prototyping Labs</text>
      <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#E3DFD7" opacity="0.8">Hardware &amp; AI Testing</text>
      <text x="20" y="102" font-family="monospace" font-size="10" fill="#3E8E5A">&#8226; Full Bench Testing</text>
    </g>
  </g>
</svg>
