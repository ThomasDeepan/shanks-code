<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0F16" />
      <stop offset="100%" stop-color="#18070D" />
    </linearGradient>
    <pattern id="tfPatt" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C9A227" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#tfGrad)" />
  <rect width="600" height="340" fill="url(#tfPatt)" />
  <circle cx="500" cy="80" r="160" fill="#6B1E2F" opacity="0.3" filter="blur(40px)" />
  
  <g transform="translate(40, 40)">
    <rect width="140" height="26" rx="5" fill="#6B1E2F" stroke="#C9A227" stroke-width="0.75" />
    <text x="12" y="17" font-family="monospace" font-size="10" font-weight="bold" fill="#FBF8EE" letter-spacing="1">FULL STACK TRACK</text>
    
    <text x="0" y="80" font-family="sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Full-Stack Software</text>
    <text x="0" y="110" font-family="sans-serif" font-size="24" font-weight="800" fill="#C9A227">Engineering</text>
    
    <text x="0" y="145" font-family="sans-serif" font-size="12" fill="#E3DFD7" opacity="0.8">Frontend interfaces, Node.js services &amp; clean system architectures.</text>

    <!-- Visual schematic node -->
    <g transform="translate(340, 20)">
      <rect width="180" height="180" rx="10" fill="#15080C" stroke="#3D1822" stroke-width="1.5" />
      <path d="M 30 50 L 90 90 L 150 50" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="4,4" />
      <circle cx="30" cy="50" r="8" fill="#6B1E2F" stroke="#C9A227" stroke-width="1" />
      <circle cx="90" cy="90" r="12" fill="#C9A227" />
      <circle cx="150" cy="50" r="8" fill="#3E8E5A" stroke="#C9A227" stroke-width="1" />
      <text x="50" y="140" font-family="monospace" font-size="10" fill="#E3DFD7">REACT &#8226; NODE</text>
      <text x="40" y="160" font-family="monospace" font-size="10" fill="#C9A227">POSTGRES &#8226; API</text>
    </g>
