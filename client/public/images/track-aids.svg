<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="taGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240D14" />
      <stop offset="100%" stop-color="#15080C" />
    </linearGradient>
    <pattern id="taPatt" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C9A227" stroke-width="0.75" stroke-opacity="0.14" />
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#taGrad)" />
  <rect width="600" height="340" fill="url(#taPatt)" />
  <circle cx="500" cy="120" r="160" fill="#6B1E2F" opacity="0.35" filter="blur(40px)" />
  
  <g transform="translate(40, 40)">
    <rect width="180" height="26" rx="5" fill="#6B1E2F" stroke="#C9A227" stroke-width="0.75" />
    <text x="12" y="17" font-family="monospace" font-size="10" font-weight="bold" fill="#FBF8EE" letter-spacing="1">AI &amp; DATA SCIENCE TRACK</text>
    
    <text x="0" y="80" font-family="sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">AI &amp; Data Science</text>
    <text x="0" y="110" font-family="sans-serif" font-size="24" font-weight="800" fill="#C9A227">Systems</text>
    
    <text x="0" y="145" font-family="sans-serif" font-size="12" fill="#E3DFD7" opacity="0.8">Predictive models, ML data pipelines, statistical visualization &amp; deep learning.</text>

    <!-- Visual neural graph -->
    <g transform="translate(340, 20)">
      <rect width="180" height="180" rx="10" fill="#15080C" stroke="#3D1822" stroke-width="1.5" />
      <!-- Neural nodes -->
      <line x1="40" y1="50" x2="90" y2="70" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.7" />
      <line x1="40" y1="90" x2="90" y2="70" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.7" />
      <line x1="40" y1="90" x2="90" y2="110" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.7" />
      <line x1="90" y1="70" x2="140" y2="90" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.7" />
      <line x1="90" y1="110" x2="140" y2="90" stroke="#C9A227" stroke-width="1.5" stroke-opacity="0.7" />

      <circle cx="40" cy="50" r="7" fill="#6B1E2F" stroke="#C9A227" stroke-width="1" />
      <circle cx="40" cy="90" r="7" fill="#6B1E2F" stroke="#C9A227" stroke-width="1" />
      <circle cx="90" cy="70" r="8" fill="#C9A227" />
      <circle cx="90" cy="110" r="8" fill="#C9A227" />
      <circle cx="140" cy="90" r="9" fill="#3E8E5A" stroke="#C9A227" stroke-width="1" />

      <text x="45" y="145" font-family="monospace" font-size="10" fill="#E3DFD7">PYTHON &#8226; PYTORCH</text>
      <text x="40" y="165" font-family="monospace" font-size="10" fill="#C9A227">DATA PIPELINES &#8226; ML</text>
    </g>
  </g>
</svg>
